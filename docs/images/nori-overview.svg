<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Nori streaming and host management</title><desc id="desc">Norishine hosts games and desktops. Norilight receives streams and can manage host settings with explicit paired-device permissions. Other GameStream clients can stream too.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211d28"/><stop offset="1" stop-color="#3d2637"/></linearGradient></defs>
<rect width="1200" height="400" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="55" fill="#f2bdce" font-size="16" letter-spacing="3">THE NORI PROJECT</text>
<rect x="48" y="90" width="340" height="240" rx="18" fill="#302c37" stroke="#806175"/>
<text x="78" y="140" fill="#fff5f8" font-size="30" font-weight="700">Norishine</text><text x="78" y="174" fill="#e0d2df" font-size="18">Your host PC</text>
<text x="78" y="222" fill="#fff5f8" font-size="18">Games · Desktop · Virtual display</text><text x="78" y="256" fill="#e0d2df" font-size="17">Settings schema and validation</text><text x="78" y="286" fill="#e0d2df" font-size="17">Permissions granted per device</text>
<rect x="812" y="90" width="340" height="240" rx="18" fill="#302c37" stroke="#806175"/>
<text x="842" y="140" fill="#fff5f8" font-size="30" font-weight="700">Norilight</text><text x="842" y="174" fill="#e0d2df" font-size="18">Your client screens</text>
<text x="842" y="222" fill="#fff5f8" font-size="18">Profiles · Monitors · Stream windows</text><text x="842" y="256" fill="#e0d2df" font-size="17">Host status and settings</text><text x="842" y="286" fill="#e0d2df" font-size="17">Restart with permission</text>
<path d="M418 174H776l-12-8m12 8-12 8" stroke="#f2bdce" stroke-width="3" fill="none"/><text x="600" y="153" text-anchor="middle" fill="#fff5f8" font-size="17">Video · Audio · Input</text>
<path d="M778 265H422l12-8m-12 8 12 8" stroke="#d4b8e9" stroke-width="3" fill="none"/><text x="600" y="235" text-anchor="middle" fill="#e0d2df" font-size="17">Paired-certificate management</text>
<text x="600" y="370" text-anchor="middle" fill="#e0d2df" font-size="17">Streaming also works with other compatible GameStream clients.</text></g></svg>